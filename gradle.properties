org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true
# Кэш конфигурации отключён: путь проекта содержит кириллицу, и кэш
# не переживает такие пути корректно.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
# Путь проекта содержит кириллицу — AGP по умолчанию отказывается работать.
# Проверка отключается осознанно: кодировка сборки зафиксирована в UTF-8.
android.overridePathCheck=true

kotlin.code.style=official
